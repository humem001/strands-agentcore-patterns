AWSTemplateFormatVersion: '2010-09-09'
Description: 'OpenAPI Agent Gateway - Serverless AI agent system with dynamic OpenAPI tool discovery'

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name prefix for all resources
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  WeatherApiKeySecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing the WeatherAPI.com API key
    Default: ''

  CredentialProviderArn:
    Type: String
    Description: ARN of the API Key credential provider for WeatherAPI (created outside CloudFormation)
    Default: ''

Conditions:
  HasCredentialProvider: !Not [!Equals [!Ref CredentialProviderArn, '']]

Outputs:
  GatewayId:
    Description: AgentCore Gateway ID
    Value: !Ref AgentCoreGateway
  
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
  
  AgentLambdaArn:
    Description: Agent Lambda Function ARN
    Value: !GetAtt AgentLambda.Arn

Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${EnvironmentName}-openapi-agent-user-pool'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${EnvironmentName}-openapi-agent-client'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  GatewayExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-gateway-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      Policies:
        - PolicyName: GatewayOutboundAuth
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GetWorkloadAccessToken
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                Resource:
                  - !Sub 'arn:aws:bedrock-agentcore:us-east-1:${AWS::AccountId}:workload-identity-directory/default'
                  - !Sub 'arn:aws:bedrock-agentcore:us-east-1:${AWS::AccountId}:workload-identity-directory/default/workload-identity/${EnvironmentName}-openapi-agent-gateway-*'
              - Sid: GetResourceApiKey
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetResourceApiKey
                Resource:
                  - !Sub 'arn:aws:bedrock-agentcore:us-east-1:${AWS::AccountId}:token-vault/default'
                  - !Sub 'arn:aws:bedrock-agentcore:us-east-1:${AWS::AccountId}:token-vault/default/apikeycredentialprovider/*'
                  - !Sub 'arn:aws:bedrock-agentcore:us-east-1:${AWS::AccountId}:workload-identity-directory/default'
                  - !Sub 'arn:aws:bedrock-agentcore:us-east-1:${AWS::AccountId}:workload-identity-directory/default/workload-identity/${EnvironmentName}-openapi-agent-gateway-*'
              - Sid: GetSecretValue
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:us-east-1:${AWS::AccountId}:secret:bedrock-agentcore-identity!default/apikey/*'

  AgentCoreGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: !Sub '${EnvironmentName}-openapi-agent-gateway'
      AuthorizerType: CUSTOM_JWT
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}/.well-known/openid-configuration'
          AllowedClients:
            - !Ref CognitoUserPoolClient
      ProtocolType: MCP
      ProtocolConfiguration:
        Mcp:
          SupportedVersions:
            - '2025-03-26'
      RoleArn: !GetAtt GatewayExecutionRole.Arn

  AgentLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-agent-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AgentLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:Converse
                  - bedrock:ConverseStream
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:ListGatewayTargets
                  - bedrock-agentcore:GetGatewayTarget
                  - bedrock-agentcore:GetGateway
                Resource: '*'

  AgentLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-agent-lambda'
      Runtime: python3.12
      Handler: agent.handler.lambda_handler
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': 'Agent Lambda placeholder'}
      Role: !GetAtt AgentLambdaRole.Arn
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          COGNITO_JWKS_URL: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}/.well-known/jwks.json'
          GATEWAY_ID: !Ref AgentCoreGateway
          BEDROCK_MODEL_ID: 'anthropic.claude-3-sonnet-20240229-v1:0'

  # API Key Credential Provider for WeatherAPI
  # Created automatically by scripts/deploy.sh via bedrock-agentcore-control CLI
  # or manually via AWS Console if CLI version < 2.28

  # Gateway Target for WeatherAPI.com
  WeatherAPITarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Condition: HasCredentialProvider
    Properties:
      GatewayIdentifier: !Ref AgentCoreGateway
      Name: weatherapi-current-weather
      Description: WeatherAPI.com current weather data via OpenAPI target
      CredentialProviderConfigurations:
        - CredentialProviderType: API_KEY
          CredentialProvider:
            ApiKeyCredentialProvider:
              ProviderArn: !Ref CredentialProviderArn
              CredentialLocation: QUERY_PARAMETER
              CredentialParameterName: key
      TargetConfiguration:
        Mcp:
          OpenApiSchema:
            InlinePayload: |
              openapi: 3.0.0
              info:
                title: WeatherAPI.com
                version: 1.0.0
                description: Real-time weather data API
              servers:
                - url: https://api.weatherapi.com/v1
              paths:
                /current.json:
                  get:
                    operationId: getCurrentWeather
                    summary: Get current weather
                    description: Get real-time weather data for a location including temperature, conditions, wind, and humidity
                    parameters:
                      - name: q
                        in: query
                        required: true
                        schema:
                          type: string
                        description: Location query (city name, coordinates, IP, etc)
                      - name: aqi
                        in: query
                        required: false
                        schema:
                          type: string
                          enum:
                            - "yes"
                            - "no"
                        description: Include air quality data
                    responses:
                      "200":
                        description: Current weather data

  AgentLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnvironmentName}-agent-lambda'
      RetentionInDays: 30
