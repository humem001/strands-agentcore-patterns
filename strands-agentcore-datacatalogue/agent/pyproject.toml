[project]
name = "runtimedeploy"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "bedrock-agentcore >= 1.0.3",
    "mcp >= 1.19.0",
    "strands-agents >= 1.13.0",
    "requests >= 2.31.0",
]